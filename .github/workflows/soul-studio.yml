name: Soul Studio – Videos aus Beiträgen

# Läuft automatisch, wenn neue Beiträge in content/posts landen,
# zusätzlich täglich (für Notion-Quellen) und auf Knopfdruck.
on:
  push:
    branches: [main]
    paths:
      - "content/posts/**"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Fertige Beiträge in Metricool einplanen"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: soul-studio
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      SOUL_ID: ${{ secrets.SOUL_ID }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      METRICOOL_TOKEN: ${{ secrets.METRICOOL_TOKEN }}
      HIGGSFIELD_WORKSPACE_ID: ${{ secrets.HIGGSFIELD_WORKSPACE_ID }}
      HIGGSFIELD_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r soul-studio/requirements.txt

      - name: Higgsfield CLI installieren
        run: curl -fsSL https://raw.githubusercontent.com/higgsfield-ai/cli/main/install.sh | sh

      - name: Higgsfield-Anmeldung wiederherstellen
        # Inhalt von ~/.config/higgsfield/credentials.json (nach `higgsfield auth login` auf deinem Rechner)
        # als Secret HIGGSFIELD_CREDENTIALS_JSON hinterlegen.
        run: |
          mkdir -p ~/.config/higgsfield
          printf '%s' "$HIGGSFIELD_CREDENTIALS_JSON" > ~/.config/higgsfield/credentials.json
          chmod 600 ~/.config/higgsfield/credentials.json
          higgsfield account status
        env:
          HIGGSFIELD_CREDENTIALS_JSON: ${{ secrets.HIGGSFIELD_CREDENTIALS_JSON }}

      - name: Neue Beiträge produzieren
        working-directory: soul-studio
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.publish }}" = "true" ]; then FLAGS="--publish"; fi
          python -m soul_studio run --limit 3 $FLAGS

      - name: Ergebnisse ins Repository übernehmen
        if: always()
        run: |
          git config user.name "soul-studio[bot]"
          git config user.email "soul-studio@users.noreply.github.com"
          git add soul-studio/output soul-studio/state
          if git diff --cached --quiet; then
            echo "Nichts Neues."
          else
            git commit -m "Soul Studio: neue Assets aus Beiträgen"
            git push
          fi
