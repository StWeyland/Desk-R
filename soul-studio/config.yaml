# Soul Studio – Konfiguration für Desk Revolution
# Geheimnisse (API-Schlüssel) gehören NICHT hierher, sondern in die Umgebung bzw. soul-studio/.env

brand:
  name: Desk Revolution
  claim: Die Zukunft der Assistenzrolle.
  handle: "@deskrevolution"
  website: deskrevolution.de

voice:
  elevenlabs_voice_id: ""          # oder Umgebungsvariable ELEVENLABS_VOICE_ID
  elevenlabs_model: eleven_v3
  language: de
  stability: 0.5
  similarity_boost: 0.8
  style: 0.2
  speed: 1.0

footage:
  provider: pexels                 # pexels = kostenlose Stock-Clips (Standard) · fal = KI-Clips, bezahlt pro Clip
  fal_model: fal-ai/kling-video/v2.5-turbo/pro/text-to-video
  fal_seconds: 5
  fal_extra: {cfg_scale: 0.5}

video:
  aspect_ratio: "9:16"
  width: 1080
  height: 1920
  fps: 30
  target_seconds: 40
  min_blocks: 4
  max_blocks: 7
  max_words_per_block: 22
  captions: word                   # word | line | none
  caption_words_per_chunk: 3
  end_card_seconds: 2.5
  end_card_text: Desk Revolution
  end_card_sub: Die Zukunft der Assistenzrolle.
  music: ""                        # optional: Pfad zu einer lizenzfreien Musikdatei
  music_volume: 0.12

carousel:
  slides: 7
  width: 1080
  height: 1350

llm:                               # nur für `brief`/`produce` per API; die Routine schreibt das Briefing selbst
  model: claude-opus-5
  effort: high

notion:
  database_url: https://app.notion.com/p/9394d55953204b3d88e53cc2f879d9c4
  data_source: collection://e2df8581-1dc1-447d-9a80-46e0f2222b6d
  status_property: Status
  trigger_status: Produzieren
  done_status: Zur Freigabe
  format_property: Format
  text_property: Entwurfstext
  asset_property: Asset
  note_property: Produktions-Notiz

metricool:
  blog_id: "6925448"
  timezone: Europe/Berlin
  reviewer_email: stefanie@deskr.onmicrosoft.com
  default_networks: [linkedin]
  schedule_offset_days: 2
  schedule_hour: 8

output_dir: soul-studio/output
state_file: soul-studio/state/processed.json
fonts_dir: soul-studio/assets/fonts
prompts_dir: soul-studio/prompts
