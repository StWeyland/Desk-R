# Soul Studio – Konfiguration für Desk Revolution
# Geheimnisse (API-Schlüssel) gehören NICHT hierher, sondern in soul-studio/.env

brand:
  name: Desk Revolution
  claim: Die Zukunft der Assistenzrolle.
  handle: "@deskrevolution"
  website: deskrevolution.de

character:
  name: steffi
  soul_id: ""                      # nach `python -m soul_studio soul create` hier eintragen
  variant: soul-2                  # soul-2 (Bilder) oder soul-cinematic (Video-Look)
  photos_dir: soul-studio/character/photos
  look: >-
    a woman in her thirties with a warm, calm and confident expression,
    modern smart-casual business outfit in muted cream and burgundy tones,
    natural make-up, realistic skin, photographic
  setting: >-
    bright modern office or home office, soft daylight, clean desk, laptop,
    warm cream and burgundy accents, shallow depth of field

voice:
  provider: elevenlabs             # elevenlabs (empfohlen, eigene geklonte Stimme) oder higgsfield
  elevenlabs_voice_id: ""          # `python -m soul_studio voices`
  elevenlabs_model: eleven_v3
  language: de
  stability: 0.5
  similarity_boost: 0.8
  style: 0.2
  speed: 1.0
  higgsfield_voice_id: ""
  higgsfield_voice_type: preset
  higgsfield_variant: elevenlabs

models:
  image: text2image_soul_v2        # Soul V2: Bilder mit deinem Gesicht
  image_quality: 2k
  talking_video: seedance_2_5      # Startbild + deine Tonspur → sprechendes Video
  talking_video_mode: std
  talking_video_resolution: 1080p
  broll_video: kling3_0            # Szenen ohne Sprechtext (Alternative: seedance_2_5, veo3_1)
  broll_video_mode: pro
  broll_seconds: 5

video:
  aspect_ratio: "9:16"
  width: 1080
  height: 1920
  fps: 30
  target_seconds: 45
  min_blocks: 4
  max_blocks: 7
  max_words_per_block: 22
  mode: mixed                      # talking_head | mixed | broll_only
  captions: word                   # word | line | none
  caption_words_per_chunk: 3
  end_card_seconds: 2.5
  end_card_text: Desk Revolution
  end_card_sub: Die Zukunft der Assistenzrolle.
  wait_timeout: 20m

llm:
  model: claude-opus-5
  effort: high

sources:
  posts_dir: content/posts         # neue .md/.txt/.html hier ablegen
  extensions: [".md", ".txt", ".html"]
  notion:
    database_id: ""                # optional: Notion-Datenbank mit Beiträgen
    status_property: Status
    ready_value: Video erstellen
    done_value: Video erstellt
    title_property: Name
    text_property: Text

publish:
  enabled: false                   # true + `run --publish`: fertige Videos in Metricool einplanen
  public_base_url: https://stweyland.github.io/Desk-R
  metricool:
    user_id: ""
    blog_id: ""
    networks: [tiktok, instagram]
    timezone: Europe/Berlin
    schedule_offset_hours: 24
    draft: true                    # erst als Entwurf anlegen, du gibst frei

output_dir: soul-studio/output
state_file: soul-studio/state/processed.json
fonts_dir: soul-studio/assets/fonts
prompts_dir: soul-studio/prompts
